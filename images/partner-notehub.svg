<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-label="NoteHub — магазин техники">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111118"/>
      <stop offset="1" stop-color="#121220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8f135"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="768" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="10" fill="url(#accent)" opacity="0.9"/>

  <!-- Иконка: ноутбук -->
  <g transform="translate(140 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="360" rx="28" fill="#0a0a0f" stroke="#1e1e2a" stroke-width="2"/>
    <rect x="92" y="110" width="236" height="150" rx="14" fill="#18181f" stroke="rgba(200,241,53,0.35)" stroke-width="4"/>
    <rect x="112" y="132" width="196" height="108" rx="10" fill="rgba(124,58,237,0.18)"/>
    <path d="M70 270h300l-18 34H88l-18-34z" fill="rgba(200,241,53,0.18)" stroke="rgba(200,241,53,0.55)" stroke-width="4" />
    <rect x="168" y="282" width="94" height="10" rx="5" fill="#c8f135" opacity="0.8"/>
  </g>

  <!-- Текст -->
  <g transform="translate(560 240)">
    <text x="0" y="0" fill="#e8e8f0" font-size="64" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif">
      NoteHub
    </text>
    <text x="0" y="54" fill="#6b6b80" font-size="26" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">
      Магазин техники
    </text>
    <text x="0" y="118" fill="#b0b0c0" font-size="22" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif">
      Ноутбуки • Подбор конфигурации • Аксессуары
    </text>

    <g transform="translate(0 160)">
      <rect x="0" y="0" width="360" height="44" rx="12" fill="rgba(124,58,237,0.14)" stroke="rgba(124,58,237,0.35)" stroke-width="2"/>
      <text x="18" y="30" fill="#a78bfa" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">
        Консультация под задачи
      </text>
    </g>
  </g>
</svg>
