<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-label="ProService — сервисный центр">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f16"/>
      <stop offset="1" stop-color="#18181f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8f135"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="768" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="10" fill="url(#accent)" opacity="0.9"/>

  <!-- Иконка: шестерня -->
  <g transform="translate(140 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="360" rx="28" fill="#0a0a0f" stroke="#1e1e2a" stroke-width="2"/>
    <path d="M200 96l22 8 18-18 22 22-18 18 8 22 26 0v32l-26 0-8 22 18 18-22 22-18-18-22 8 0 26h-32l0-26-22-8-18 18-22-22 18-18-8-22-26 0v-32l26 0 8-22-18-18 22-22 18 18 22-8 0-26h32z"
          fill="rgba(124,58,237,0.28)" stroke="rgba(124,58,237,0.7)" stroke-width="4"/>
    <circle cx="184" cy="176" r="44" fill="#18181f" stroke="#c8f135" stroke-width="6"/>
    <circle cx="184" cy="176" r="10" fill="#c8f135"/>
  </g>

  <!-- Текст -->
  <g transform="translate(560 240)">
    <text x="0" y="0" fill="#e8e8f0" font-size="64" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif">
      ProService
    </text>
    <text x="0" y="54" fill="#6b6b80" font-size="26" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">
      Сервисный центр
    </text>
    <text x="0" y="118" fill="#b0b0c0" font-size="22" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif">
      Сложные ремонты • Пайка • Восстановление
    </text>

    <g transform="translate(0 160)">
      <rect x="0" y="0" width="360" height="44" rx="12" fill="rgba(200,241,53,0.12)" stroke="rgba(200,241,53,0.35)" stroke-width="2"/>
      <text x="18" y="30" fill="#c8f135" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">
        Профильный ремонт техники
      </text>
    </g>
  </g>
</svg>
