<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-label="TechMarket — магазин техники">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111118"/>
      <stop offset="1" stop-color="#15151f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8f135"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="768" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="10" fill="url(#accent)" opacity="0.9"/>

  <!-- Иконка: пакет/покупки -->
  <g transform="translate(140 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="360" rx="28" fill="#0a0a0f" stroke="#1e1e2a" stroke-width="2"/>
    <path d="M120 140h200l-18 170H138l-18-170z" fill="rgba(200,241,53,0.18)" stroke="rgba(200,241,53,0.65)" stroke-width="4"/>
    <path d="M170 150c0-28 18-48 50-48s50 20 50 48" fill="none" stroke="#c8f135" stroke-width="10" stroke-linecap="round"/>
    <rect x="160" y="204" width="120" height="18" rx="9" fill="#7c3aed" opacity="0.75"/>
    <rect x="178" y="236" width="160" height="12" rx="6" fill="#6b6b80" opacity="0.5"/>
    <rect x="178" y="258" width="140" height="12" rx="6" fill="#6b6b80" opacity="0.5"/>
  </g>

  <!-- Текст -->
  <g transform="translate(560 240)">
    <text x="0" y="0" fill="#e8e8f0" font-size="64" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif">
      TechMarket
    </text>
    <text x="0" y="54" fill="#6b6b80" font-size="26" font-weight="600" font-family="Inter, Segoe UI, Arial, sans-serif">
      Магазин техники
    </text>
    <text x="0" y="118" fill="#b0b0c0" font-size="22" font-weight="500" font-family="Inter, Segoe UI, Arial, sans-serif">
      Широкий выбор • Самовывоз • Возврат
    </text>

    <g transform="translate(0 160)">
      <rect x="0" y="0" width="360" height="44" rx="12" fill="rgba(124,58,237,0.14)" stroke="rgba(124,58,237,0.35)" stroke-width="2"/>
      <text x="18" y="30" fill="#a78bfa" font-size="18" font-weight="700" font-family="Inter, Segoe UI, Arial, sans-serif">
        Официальная гарантия
      </text>
    </g>
  </g>
</svg>
